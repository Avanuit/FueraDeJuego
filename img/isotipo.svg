<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#050505"/>
  
  <!-- Borde rojo grueso brutalista -->
  <circle class="logo-ring" cx="50" cy="50" r="44" fill="none" stroke="#FF2A00" stroke-width="6"/>
  
  <!-- Aro interior sutil para profundidad -->
  <circle class="logo-inner-ring" cx="50" cy="50" r="38" fill="none" stroke="#222222" stroke-width="1"/>
  
  <!-- Pentagono central estilizado -->
  <polygon class="logo-pentagon" points="50,28 66,41 60,60 40,60 34,41" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="miter"/>
  
  <!-- Iniciales FJ en blanco puro -->
  <text class="logo-text" x="50" y="48" font-family="'Alfa Slab One', 'Space Grotesk', system-ui, sans-serif" font-weight="400" font-size="24" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="1">FJ</text>
</svg>
