<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular oscuro -->
  <circle cx="50" cy="50" r="48" fill="#050505"/>
  
  <!-- Borde rojo grueso estilo vintage -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FF2A00" stroke-width="4"/>
  
  <!-- Pentagono central (nucleo del balon) -->
  <polygon points="50,30 63,40 58,56 42,56 37,40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Lineas gruesas que salen del pentagono (patron de balon clasico) -->
  <line x1="50" y1="30" x2="50" y2="14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="63" y1="40" x2="78" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="56" x2="70" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="42" y1="56" x2="30" y2="72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="40" x2="22" y2="30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Iniciales FJ -->
  <text x="50" y="50" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="20" fill="#FF2A00" text-anchor="middle" dominant-baseline="central" letter-spacing="2">FJ</text>
</svg>